# =====================================================================
# DataTalk AI - Application Configuration
# =====================================================================

# Optional local secrets file (KEY=value lines, e.g. NVIDIA_API_KEY=...). Git-ignored; real env vars still win.
spring.config.import=optional:file:.env[.properties]

# Application
spring.application.name=DataTalk AI POC
server.servlet.context-path=/datatalk

# Server Configuration
server.port=8081
# Trust X-Forwarded-* headers so redirects keep the public https URL behind a tunnel (ngrok) or reverse proxy
server.forward-headers-strategy=native
server.error.include-message=always
server.error.include-binding-errors=always

# =====================================================================
# DATABASE CONFIGURATION
# =====================================================================
# Use environment variables or system properties for sensitive data
# Example: java -Dspring.datasource.password=<your-password>

# PostgreSQL Neon Database Connection
# Neon Host: ep-lingering-brook-b3tgnze7.ap-southeast-1.aws.neon.tech (Asia Pacific Southeast 1)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-lingering-brook-b3tgnze7-pooler.c-4.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${DB_USER:user_datatalk}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =====================================================================
# SPRING MVC CONFIGURATION
# =====================================================================
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.html

# =====================================================================
# SECURITY CONFIGURATION
# =====================================================================
# Session management
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m

# =====================================================================
# LOGGING CONFIGURATION
# =====================================================================
logging.level.root=INFO
logging.level.com.datatalk.datatalkai=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.postgresql.jdbc=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.file.name=logs/datatalk-ai.log
logging.file.max-size=10MB
logging.file.max-history=10

# =====================================================================
# ACTUATOR CONFIGURATION (Optional - for monitoring)
# =====================================================================
# management.endpoints.web.exposure.include=health,info
# management.endpoint.health.show-details=when-authorized

# =====================================================================
# JACKSON CONFIGURATION (JSON Processing)
# =====================================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

# =====================================================================
# THYMELEAF CONFIGURATION
# =====================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =====================================================================
# APPLICATION CUSTOM PROPERTIES
# =====================================================================
# These can be accessed via @Value annotation
app.name=DataTalk AI
app.version=0.2.0
app.description=Natural Language Business Data Analytics POC
app.max-login-attempts=5
app.account-lock-duration=30m

# Serve classpath:/static/** at /datatalk/static/** (matches links used in the HTML pages)
spring.mvc.static-path-pattern=/static/**

# =====================================================================
# PHASE 2 - AI NATURAL LANGUAGE REPORTING
# =====================================================================
# AI providers: groq | openai | nvidia | gemini. API keys come ONLY from environment variables (or the git-ignored .env).
# Primary provider, then comma-separated fallbacks tried in order when the previous one fails or times out.
app.ai.provider=${AI_PROVIDER:groq}
app.ai.fallback-providers=${AI_FALLBACK_PROVIDERS:gemini,nvidia}
# Groq (fast, free tier: 30 req/min, 8K tokens/min for gpt-oss). Key from https://console.groq.com
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
app.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.ai.groq.read-timeout-seconds=${GROQ_READ_TIMEOUT_SECONDS:30}
app.ai.groq.max-tokens=${GROQ_MAX_TOKENS:1024}
app.ai.groq.reasoning-effort=${GROQ_REASONING_EFFORT:low}
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
# GEMINI_MODEL may list several models (comma-separated); each is tried in order
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.ai.gemini.read-timeout-seconds=${GEMINI_READ_TIMEOUT_SECONDS:60}
# NVIDIA API catalog (OpenAI-compatible). Key from https://build.nvidia.com (env var only)
app.ai.nvidia.api-key=${NVIDIA_API_KEY:}
app.ai.nvidia.model=${NVIDIA_MODEL:deepseek-ai/deepseek-v4.1-flash}
app.ai.nvidia.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
app.ai.nvidia.read-timeout-seconds=${NVIDIA_READ_TIMEOUT_SECONDS:90}
app.ai.connect-timeout-seconds=10
# Default read timeout for providers without their own setting
app.ai.read-timeout-seconds=${AI_READ_TIMEOUT_SECONDS:120}
# Max predefined report examples sent to the AI per question (keeps prompts small)
app.ai.max-examples=4
# auto = Windows certificate store on Windows (fixes PKIX errors behind corporate proxies), default = JVM cacerts
app.ai.trust-store-type=${AI_TRUST_STORE_TYPE:auto}

# Reporting: approved schemas, blocked (sensitive) columns and execution limits
app.reporting.approved-schemas=corp,location,device,txn
app.reporting.blocked-columns=txn.payment_transaction.card_last_four,corp.customer.email,corp.customer.phone
# SELECT-only database role used for every AI/report query (SET LOCAL ROLE inside a read-only transaction)
app.reporting.read-only-role=${REPORT_DB_ROLE:datatalk_ro}
app.reporting.statement-timeout-seconds=30
app.reporting.default-page-size=25
app.reporting.max-page-size=100
app.reporting.max-sql-length=6000
# Tables each role may query (ADMIN/BUSINESS/MANAGER: all approved tables)
app.reporting.role-tables.CUSTOMER=txn.payment_transaction,device.device,device.device_status_log,location.location,device.device_health_metric,txn.refund

# Export: PDF default, Excel optional; large exports run in the background
app.export.max-rows=50000
app.export.async-threshold-rows=2000
app.export.directory=${EXPORT_DIR:${java.io.tmpdir}/datatalk-exports}

# Public URL: start an ngrok tunnel automatically when the app starts (needs the ngrok CLI + authtoken)
app.ngrok.enabled=${NGROK_ENABLED:true}
app.ngrok.command=${NGROK_COMMAND:ngrok}
# Optional fixed domain, e.g. your-name.ngrok-free.dev (blank = ngrok account default)
app.ngrok.domain=${NGROK_DOMAIN:}
