# =====================================================================
# DataTalk AI - Application Configuration
# =====================================================================

# Application
spring.application.name=DataTalk AI POC
server.servlet.context-path=/datatalk

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# =====================================================================
# DATABASE CONFIGURATION
# =====================================================================
# Use environment variables or system properties for sensitive data
# Example: java -Dspring.datasource.password=yourpassword -jar app.jar

# PostgreSQL Neon Database Connection
# Neon Host: ep-lingering-brook-b3tgnze7.aws.neon.tech (Asia Pacific Southeast 1)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-lingering-brook-b3tgnze7.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${DB_USER:user_datatalk}
spring.datasource.password=${DB_PASSWORD:npg_IdEYW0bR8heu}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =====================================================================
# SPRING MVC CONFIGURATION
# =====================================================================
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.html

# =====================================================================
# SECURITY CONFIGURATION
# =====================================================================
# Session management
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m

# =====================================================================
# LOGGING CONFIGURATION
# =====================================================================
logging.level.root=INFO
logging.level.com.datatalk.datatalkai=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.postgresql.jdbc=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.file.name=logs/datatalk-ai.log
logging.file.max-size=10MB
logging.file.max-history=10

# =====================================================================
# ACTUATOR CONFIGURATION (Optional - for monitoring)
# =====================================================================
# management.endpoints.web.exposure.include=health,info
# management.endpoint.health.show-details=when-authorized

# =====================================================================
# JACKSON CONFIGURATION (JSON Processing)
# =====================================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

# =====================================================================
# THYMELEAF CONFIGURATION
# =====================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =====================================================================
# APPLICATION CUSTOM PROPERTIES
# =====================================================================
# These can be accessed via @Value annotation
app.name=DataTalk AI
app.version=0.1.0
app.description=Natural Language Business Data Analytics POC
app.max-login-attempts=5
app.account-lock-duration=30m
