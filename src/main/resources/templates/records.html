<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'SL Talk AI - ' + ${title}">SL Talk AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/sltalk/static/img/logo.svg">
    <link rel="stylesheet" href="/sltalk/static/css/style.css">
    <style>
        .record-table tbody tr { cursor: pointer; }
        .record-table td, .record-table th { font-size: .875rem; }
    </style>
</head>
<body th:attr="data-page=${page}">
    <nav th:replace="~{fragments/navbar :: navbar(${page})}"></nav>

    <div class="container py-4">
        <div id="pageAlert" class="alert d-none"></div>

        <div id="listView" class="d-none">
            <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
                <h4 class="mb-0" id="listTitle" th:text="${title}">Records</h4>
                <div class="d-flex gap-2">
                    <input type="text" id="listFilter" class="form-control form-control-sm" maxlength="100" aria-label="Filter list">
                    <button class="btn btn-sm btn-primary text-nowrap d-none" id="createBtn"></button>
                </div>
            </div>
            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-sm mb-0 align-middle record-table">
                            <thead><tr id="listHead"></tr></thead>
                            <tbody id="listBody"><tr><td class="text-muted p-3">Loading...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <small class="text-muted">Showing up to 200 records. Use the filter to narrow the list.</small>
        </div>

        <div id="detailView" class="d-none">
            <a href="#" id="backLink" class="small"><i class="fas fa-arrow-left"></i> Back to list</a>
            <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center my-2">
                <h4 class="mb-0" id="detailTitle"></h4>
                <div id="detailActions"></div>
            </div>
            <div class="card mb-3"><div class="card-body"><dl class="row mb-0" id="detailFields"></dl></div></div>
            <div id="detailSections"></div>
        </div>
    </div>

    <div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="formTitle" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" id="recordForm" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="formTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="formAlert" class="alert alert-danger d-none"></div>
                    <div id="formFields"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
                </div>
            </form>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/sltalk/static/js/records.js"></script>
</body>
</html>
