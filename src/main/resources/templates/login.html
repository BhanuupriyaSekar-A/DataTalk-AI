<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SL Talk AI - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/sltalk/static/img/logo.svg">
    <link rel="stylesheet" href="/sltalk/static/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-bg" aria-hidden="true">
        <span class="auth-blob b1"></span>
        <span class="auth-blob b2"></span>
        <span class="auth-blob b3"></span>
    </div>

    <main class="auth-shell">
        <div class="auth-card">
            <div class="auth-brand">
                <img src="/sltalk/static/img/logo.svg" alt="" class="auth-logo" width="44" height="44">
                <span class="auth-name">SL Talk<span class="brand-ai">AI</span></span>
            </div>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-sub">Sign in to search your business data and generate reports with AI.</p>

            <div id="alertContainer" aria-live="polite"></div>

            <form id="loginForm" novalidate>
                <div class="auth-field">
                    <label for="username" class="form-label">Username</label>
                    <div class="auth-input">
                        <i class="fas fa-user lead-icon" aria-hidden="true"></i>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="Enter your username" autocomplete="username" required autofocus>
                    </div>
                </div>

                <div class="auth-field">
                    <label for="password" class="form-label">Password</label>
                    <div class="auth-input has-toggle">
                        <i class="fas fa-lock lead-icon" aria-hidden="true"></i>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" title="Show password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="auth-options">
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 auth-submit" id="loginBtn">
                    <span id="btnText">Sign In</span>
                    <span id="spinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
                </button>
            </form>

            <div class="auth-demo">
                <div class="auth-demo-label">Demo accounts</div>
                <div class="auth-demo-users">
                    <button type="button" class="chip" data-demo-user="admin_user">admin_user</button>
                    <button type="button" class="chip" data-demo-user="techpay_manager">techpay_manager</button>
                    <button type="button" class="chip" data-demo-user="retail_manager">retail_manager</button>
                    <button type="button" class="chip" data-demo-user="restaurant_owner">restaurant_owner</button>
                </div>
                <div class="auth-demo-note">Click an account to fill in the form. Password for all: <code>DemoPass@123</code></div>
            </div>
        </div>

        <div class="auth-features">
            <span><i class="fas fa-compass"></i>Application Search</span>
            <span><i class="fas fa-wand-magic-sparkles"></i>AI Report Search</span>
            <span><i class="fas fa-shield-halved"></i>Role-based data access</span>
        </div>
        <footer class="auth-footer">
            SL Talk AI &copy; 2026 &middot; <a href="/sltalk/poc-info">Project Information</a>
        </footer>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showAlert('Please enter username and password', 'warning');
                return;
            }

            // Show loading state
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            
            loginBtn.disabled = true;
            btnText.textContent = 'Signing In...';
            spinner.classList.remove('d-none');

            try {
                const response = await fetch('/sltalk/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/sltalk/home';
                    }, 1000);
                } else {
                    showAlert(data.message || data.error || 'Login failed', 'danger');
                    loginBtn.disabled = false;
                    btnText.textContent = 'Sign In';
                    spinner.classList.add('d-none');
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('An error occurred during login', 'danger');
                loginBtn.disabled = false;
                btnText.textContent = 'Sign In';
                spinner.classList.add('d-none');
            }
        });

        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alertDiv);

            // Auto-hide after 5 seconds
            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }

        // Handle URL parameters
        const params = new URLSearchParams(window.location.search);
        if (params.get('error')) showAlert('Invalid credentials', 'danger');
        if (params.get('logout')) showAlert('You have been logged out', 'info');
        if (params.get('expired')) showAlert('Your session has expired', 'warning');

        document.getElementById('pwToggle').addEventListener('click', ev => {
            const pw = document.getElementById('password');
            const show = pw.type === 'password';
            pw.type = show ? 'text' : 'password';
            const btn = ev.currentTarget;
            btn.innerHTML = `<i class="fas ${show ? 'fa-eye-slash' : 'fa-eye'}"></i>`;
            btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            btn.title = btn.getAttribute('aria-label');
        });

        // Demo accounts (POC only): fill in the form; the user still clicks Sign In.
        document.querySelectorAll('[data-demo-user]').forEach(b => b.addEventListener('click', () => {
            document.getElementById('username').value = b.dataset.demoUser;
            document.getElementById('password').value = 'DemoPass@123';
            document.getElementById('loginBtn').focus();
        }));
    </script>
</body>
</html>
