<!-- Minimal header shared by all signed-in pages. Pages and records are reached through the Home search (search.js). -->
<nav th:fragment="navbar(active)" class="navbar navbar-dark app-header">
    <div class="container-fluid">
        <a class="navbar-brand brand" href="/sltalk/home" title="Home">
            <img src="/sltalk/static/img/logo.svg" alt="" class="brand-logo" width="32" height="32">
            <span class="brand-text">SL Talk<span class="brand-ai">AI</span></span>
        </a>
        <div class="d-flex align-items-center gap-2 ms-auto">
            <a class="btn btn-sm header-btn" href="/sltalk/home"
               th:unless="${active == 'home'}" title="Search">
                <i class="fas fa-magnifying-glass"></i><span class="d-none d-sm-inline ms-1">Search</span>
            </a>
            <div class="dropdown">
                <a class="nav-link dropdown-toggle user-chip" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">

                    <span class="user-meta d-none d-md-flex">
                        <span class="user-name" id="userDisplay">User</span>

                    </span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end user-menu" aria-labelledby="userDropdown">
                    <li class="dropdown-item-text">
                        <div class="fw-semibold" id="userMenuName"></div>
                        <div class="small text-muted" id="userRole"></div>

                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="/sltalk/home"><i class="fas fa-house me-2"></i>Home</a></li>
                    <li><a class="dropdown-item" href="/sltalk/poc-info"><i class="fas fa-circle-info me-2"></i>Project Info</a></li>

                    <li><a class="dropdown-item" href="#" onclick="logout(); return false;"><i class="fas fa-right-from-bracket me-2"></i>Logout</a></li>
                </ul>
            </div>
        </div>
    </div>
    <script src="/sltalk/static/js/navbar.js" defer></script>
