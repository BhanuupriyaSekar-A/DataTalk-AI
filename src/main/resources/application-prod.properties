# Production overrides. Activate with SPRING_PROFILES_ACTIVE=prod (or --spring.profiles.active=prod).

# Don't leak exception/validation details to clients
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Requires HTTPS (directly or via a reverse proxy/tunnel sending X-Forwarded-Proto)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

logging.level.root=INFO
logging.level.com.datatalk.datatalkai=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

spring.thymeleaf.cache=true
spring.jackson.serialization.indent-output=false
